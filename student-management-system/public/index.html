<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Campus Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">Campus<span class="accent">Dash</span></div>
        <nav class="nav">
          <a class="nav-item active">Dashboard</a>
          <a class="nav-item">Students</a>
          <a class="nav-item">Departments</a>
          <a class="nav-item">Settings</a>
        </nav>
        <div class="sidebar-footer">© Campus 2026</div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="search-wrap">
            <input id="globalSearch" placeholder="Search students, roll, department..." />
          </div>
          <div class="top-actions">
            <button id="newStudentBtn" class="btn small">+ New</button>
            <div class="avatar">DK</div>
          </div>
        </header>

        <section class="content">
          <div class="cards">
            <div class="card stat">
              <div class="label">Total Students</div>
              <div class="value" id="totalCount">0</div>
            </div>
            <div class="card stat">
              <div class="label">Departments</div>
              <div class="value" id="deptCount">0</div>
            </div>
            <div class="card stat">
              <div class="label">Recent</div>
              <div class="value" id="recentCount">—</div>
            </div>
          </div>

          <!-- Add / Edit Form (keeps original functionality) -->
          <div class="form-card card">
            <h3 id="formTitle">Add New Student</h3>
            <form id="studentForm">
              <input type="hidden" id="studentId" />
              <div class="form-grid">
                <div class="form-group">
                  <label>Name</label>
                  <input id="name" placeholder="Full name" required />
                </div>
                <div class="form-group">
                  <label>Roll Number</label>
                  <input id="rollNumber" placeholder="e.g. CS2024001" required />
                </div>
                <div class="form-group">
                  <label>Department</label>
                  <select id="department" required>
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Electronics</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                    <option>Information Technology</option>
                    <option>Electrical</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Email</label>
                  <input id="email" type="email" placeholder="student@college.edu" />
                </div>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn primary" id="submitBtn">Add Student</button>
                <button type="button" class="btn secondary" id="cancelBtn" style="display:none">Cancel</button>
              </div>
            </form>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>Students</h3>
              <div class="panel-controls">
                <select id="deptFilter"><option value="">All departments</option></select>
              </div>
            </div>
            <div class="table-scroll">
              <table class="table" id="studentsTable">
                <thead>
                  <tr><th>#</th><th>Name</th><th>Roll</th><th>Dept</th><th>Email</th><th></th></tr>
                </thead>
                <tbody id="studentBody">
                  <tr><td colspan="6" class="empty">No students yet</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <footer class="footer">Built for demonstration — redesigned UI</footer>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
  </body>
</html>
